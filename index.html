const T=[['10:00','WAKE UP','系统启动，开始工作','RUNNING',96,'odododddo',320,786,838,243,786],
['11:30','DEEP WORK','进入工作状态','DEEP WORK',78,'ooodoodoo',320,1022,1074,243,1030],
['13:05','PAUSE','暂停一下，干饭干饭','PAUSED',60,'odddodooo',742,1076,1130,763,1204],
['15:40','RESTART','下午工作重新开始','RESTARTED',72,'ohodohddo',1150,1208,1262,1303,1339],
['18:20','EXTENDED MODE','撤离失败','EXTENDED',41,'ooohooodo',517,1390,1444,941,1491],
['18:50','LOW BATTERY','脑袋空空','LOW BATTERY',7,'ddddodddd',197,1560,1614,600,1693],

const L=OB.map(rs=>rs.map(r=>{const d=document.createElement('div');d.className='ly';d.style.clipPath=`inset(${r[1]/H0*100}% ${100-r[2]/W0*100}% ${100-r[3]/H0*100}% ${r[0]/W0*100}%)`;pl.insertBefore(d,boot);return d}));

const sleep=ms=>new Promise(r=>setTimeout(r,ms));let booted=false,skip=false,cur=-1;
async function bootSeq(){const w=ms=>skip?0:sleep(ms);boot.innerHTML='<div><span>STUDIO OS — BOOTING</span></div>';await w(500);

function apply(k){const a=T[k];$('tm').textContent=a[0];$('en').textContent=a[1]+' · '+a[4]+'%';$('cn').textContent=a[2];$('bar').style.width=a[4]+'%';[...a[5]].forEach((c,i)=>set(i,c));pl.classList.toggle('low',k==5)}
const pr=el=>{const r=el.getBoundingClientRect();return Math.min(1,Math.max(0,-r.top/(r.height-innerHeight)))};
function upd(){const p=pr($('s2'));if(!booted&&p>.012)skip=true;

else{boot.style.opacity=0;hud.style.opacity=1;const k=Math.min(5,Math.floor(p*6));if(k!=cur){cur=k;apply(k)}}}
